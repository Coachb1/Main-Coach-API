<!DOCTYPE html>
<html>
<head>
  <title>Processing Status</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f4f8;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 480px;
      margin: 8% auto;
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h2 {
      color: #00b894;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background-color: #00b894;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #019875;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>✅ File is being processed!</h2>
    <p>{{ message }}</p>
    <a href="{% url 'bulk_prompt_status' task_id %}" class="btn">Check Status & Download</a>
  </div>

</body>
</html>
