<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="image-container">
      <img src="https://i.ibb.co/FBMBsHz/icon.png" alt="keys" />
    </div>
    <!-- From Django, I'll be getting Test and Test Session ID, Participant ID, questions, responses and feedback to those responses-->
    <!-- Generate a good html to showcase such values -->
    <h1>Test Report</h1>
    <!-- <h2>Test: {{ test_name }}</h2> -->
    <h2>Test: {{ test_name }}</h2>
    <h2>Test code: {{ test_code }}</h2>

    <h3>Total Tests Attempts</h3>
    <p>{{ total_tests_attempts }}</p>
    <hr />

    <h3> Test scores </h3>

    <!-- {% for test_score in test_scores %}
      <h3>{{ test_score.participant.name }}</h3>
      <p>{{ test_score.score }}</p>
      <hr />
    {% endfor %} -->

    <table class="table table-bordered" rules="all">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Participant</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        {% for test_score in test_scores %}
          <tr>
            <td class="td-center">{{ forloop.counter }}</td>
            <td class="td-center">{{ test_score.participant.name }}</td>
            <td class="td-center">{{ test_score.score }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

  </body>
</html>
