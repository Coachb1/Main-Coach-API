<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="image-container">
      <img src="https://i.ibb.co/FBMBsHz/icon.png" alt="keys" />
    </div>
    <!-- From Django, I'll be getting Test and Test Session ID, Participant ID, questions, responses and feedback to those responses-->
    <!-- Generate a good html to showcase such values -->
    <h1>Leaderboard Report (Top 10)</h1>
    <!-- <h2>Test: {{ test_name }}</h2> -->

    <h3>Top 10 Participants</h3>
    <hr />

    <table>
      <tr>
        <th>Rank</th>
        <th>Participant Name</th>
        <th>Score</th>
      </tr>
      {% for participant in participants_skill_scores %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ participant.name }}</td>
          <td>{{ participant.skills_info }}</td>
        </tr>
      {% endfor %}
  </body>
</html>
