</head>
<body
    <div class="container">
        <h1 class="header-title">Coach<span class="white-text bg-title">BOT</span></h1>
        <h1 class="welcome-text">Welcome to the Coach and Bots Creation Page!</h1>
        <p class="message-text">Upload a csv file to create Coaches and Bots.</p>
        <h1 id='urlSlug' style="display: none;">{{urlSlug}}</h1>
        <form id="form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button id="submit-button" class="submit-button" type="submit">Submit</button>
        </form>
        <br><br>
        <b><h5>Bot Upload Template - <a href="https://docs.google.com/spreadsheets/d/1HXeDMhiYobxr5BdDnOWOhOkz0kLbaNmW8PljdzIvd8Y/edit?usp=sharing" target="_blank">Click Here</a></h5></b>
        <h1 id="message" class="message-text red-text"></h1>
    </div>

    <script>
        let message = document.getElementById('message');
        let submitButton = document.getElementById('submit-button');
        let form = document.getElementById('form');
        const urlSlug = document.getElementById('urlSlug').innerHTML;

        form.addEventListener('submit', function(e){
            e.preventDefault()
            submitButton.disabled = true;
            submitButton.textContent = "Processing..."
            submitButton.style.cursor = "not-allowed";
            const formData = new FormData(this);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
            fetch(`{% url urlSlug %}`, {
                method: 'POST',
                body: formData
            }).then((response)=>{
                submitButton.disabled = false;
                submitButton.textContent = "submit"
                submitButton.style.cursor = "pointer";
        
                if(response.ok){
                    form.reset()
                    console.log('File uploaded successfully');
                    document.getElementById('message').innerHTML = 'File Uploaded Successfully! <br>'
                    // response data is a file. upload it to the client's system

                    response.blob().then(function(blob){
                        let url = window.URL.createObjectURL(blob);
                        let a = document.createElement('a');
                        a.href = url;
                        let timestamp = new Date().toLocaleDateString() + '-' + new Date().toLocaleTimeString().replace(/:/g, '-');
                            
                        // Set the download filename with the timestamp
                        a.download = 'test-' + timestamp + '.csv';
                        a.click();
                    })
                }
                else{
                    form.reset()
                    response.json().then(function(result){
                        console.log(result)

                        if(result['exception']===undefined){
                            let records = JSON.stringify(result);
                            document.getElementById('message').innerHTML = ''
                            document.getElementById('message').innerHTML += "<br>"
                            Object.keys(result).forEach(function(key){
                                if(key!=='errors'){
                                    document.getElementById('message').innerHTML += key + ": " + result[key] + "<br>";
                                }
                            }) 
                        }
                        else{
                            document.getElementById('message').innerHTML = "Error occured Please check CSV: " + result['errors'];
                        }
                        console.log(result)
                        if (result.file_response) {
                            let url = window.URL.createObjectURL(new Blob([result.file_response]));
                            let a = document.createElement('a');
                            a.href = url;
                            // Create a timestamp for the filename (using local time)
                            let timestamp = new Date().toLocaleDateString() + '-' + new Date().toLocaleTimeString().replace(/:/g, '-');
                            
                            // Set the download filename with the timestamp
                            a.download = 'coach_bots-' + timestamp + '.csv';
                            a.click();
                        }
                    })
                }
            })


        })

    </script>

</body>
</html>
