{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Create Test</title>
    <!-- <link rel="stylesheet" type="text/css" href= "{% static 'css/index.css' %}"> -->
    <style>
        body{
    height:100vh;
    width:100vw;
    background-color: #f5f5f5;
    display:flex;
    justify-content:start;
    align-items:center;
    flex-direction:column;
    font-family: Poppins, Roboto, sans-serif;
}

font-face{
    font-family: 'Poppins', 'Roboto', sans-serif;
    src: url('../fonts/Poppins-Regular.ttf')
}

.container{
    width: 100%;
    height: 100%;
    display:flex;
    padding-top: 20px;
    justify-content:start;
    align-items:center;
    flex-direction:column;
}

.header-title{
    font-size: 40px;
    font-weight: 600;
    color: #0152a9;
    margin-bottom: 20px;
    width:90%;
    text-align:center;
    padding-bottom: 10px;
    border-bottom:#1e1d1d 3px solid;
    user-select: none;
}

.welcome-text{
    font-size: 30px;
    font-weight: 600;
    color: #1e1d1d;
    margin-bottom: 20px;
    user-select: none;
}

.message-text{
    font-size: 20px;
    font-weight: 600;
    color: #1e1d1d;
    margin-bottom: 20px;
    user-select: none;
}

.select-file-text{
    cursor: pointer;
    font-size: 20px;
    font-weight: 600;
    color: #fffafa;
    background-color: #0152a9;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    user-select: none;
}

.select-file{
    cursor: pointer;
    width: 100%;
    height: 50px;
    background-color: #0152a9;
    border-radius: 10px;
    border: none;
    color: #f5f5f5;
    font-size: 20px;
    font-weight: 600;
    user-select: none;
    font:'Poppins', 'Roboto', sans-serif;
}

.submit-button{
    width: 30%;
    height: 25px;
    background-color: #0152a9;
    border-radius: 10px;
    border: none;
    color: #f5f5f5;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    margin-left:130px;
    padding-top: 3px;
    padding-bottom: 3px;
}

.red-text{
    color:rgb(212, 45, 15);
}

.white-text{
    color: #f5f5f5;
}

.bg-title{
    background-color: rgba(179, 18, 0, 0.926);
    padding-right: 10px;
    padding-left: 3px;
}

.button-div{
    width: 100%;
    user-select: none;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:row;
    gap:20px;
    margin-top: 20px;
}

.select-button{
    width: 200px;
    height: 50px;
    background-color: #0152a9;
    border-radius: 10px;
    border: none;
    color: #f5f5f5;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
}

.select-button:hover{
    background-color: #1e1d1d;
}

.form{
    width: 100%;
    height: 100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

input[type="text"]{
    margin-top: 5px;
    width: 100%;
    height: 30px;
    border-radius: 10px;
    border: none;
    color: #1e1d1d;
    font-size: 15px;
    font-weight: 600;
    user-select: none;
    font-family:'Poppins', 'Roboto', sans-serif;
    padding-left: 10px;
    background-color: #e0dede;
}

input[type="email"]{
    margin-top: 5px;
    width: 100%;
    height: 30px;
    border-radius: 10px;
    border: none;
    color: #1e1d1d;
    font-size: 15px;
    font-weight: 600;
    user-select: none;
    font-family:'Poppins', 'Roboto', sans-serif;
    padding-left: 10px;
    background-color: #e0dede;
}

input[type="password"]{
    margin-top: 5px;
    width: 100%;
    height: 30px;
    border-radius: 10px;
    border: none;
    color: #1e1d1d;
    font-size: 15px;
    font-weight: 600;
    user-select: none;
    font:'Poppins', 'Roboto', sans-serif;
    padding-left: 10px;
    background-color: #e0dede;
}

input[type='file']{
    font-family: 'Poppins', 'Roboto', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #1e1d1d;
}
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">Coach<span class="white-text bg-title">BOT</span></h1>
        <h1 class="welcome-text">Welcome to the Test Create Page!</h1>
        <p class="message-text">Upload a csv file to create tests.</p>
        <div class="button-div">
            <button id="slack-redirect" class="select-button">Create Normal/Static Scenarios</button>
            <button id="slack-orchestrated-test-redirect" class="select-button">Create Dynamic/GD Scenarios</button>
            <button id="bot-profile-upload" class="select-button">Create Bot/Profile</button>
        </div>
        <br><br>
        <h1 id="message" class="message-text red-text"></h1>
    </div>

    <script>
        let slackRedirect = document.getElementById('slack-redirect');
        let slackOrchestratedRedirect = document.getElementById('slack-orchestrated-test-redirect');
        let profileUpload = document.getElementById('bot-profile-upload');

        slackRedirect.addEventListener('click', () => {
            window.location.href = '/api/create-test-slack/';
        });

        profileUpload.addEventListener('click', () => {
            window.location.href = '/api/upload-coach-bots/';
        });
        slackOrchestratedRedirect.addEventListener('click', () => {
            window.location.href = '/api/test-create-orchestrated-conversation-slack/';
        });

    </script>

</body>
</html>
