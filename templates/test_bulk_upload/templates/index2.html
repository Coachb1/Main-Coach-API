<!DOCTYPE html>
<html>
<head>
    <title>Create Test</title>
    <!-- <link rel="stylesheet" type="text/css" href="{% static 'css/index.css' %}"> -->
    <style>
        body{

.container{
    width: 100%;

.header-title{

.submit-button{

}

.red-text{

.white-text{
    color: #f5f5f5;
}

.bg-title{
    background-color: rgba(179, 18, 0, 0.926);
    padding-right: 10px;
    padding-left: 3px;
}

.button-div{
    width: 100%;
    user-select: none;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:row;
    gap:20px;
    margin-top: 20px;
}

.select-button{
    width: 200px;
    height: 50px;
    background-color: #0152a9;
    border-radius: 10px;
    border: none;
    color: #f5f5f5;
    font-size: 15px;
    font-weight: 600;

}

.select-button:hover{
    background-color: #1e1d1d;
}

.form{
    width: 100%;
    height: 100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

input[type="text"]{
    margin-top: 5px;
    width: 100%;

    border-radius: 10px;
    border: none;

input[type="email"]{
    margin-top: 5px;
    width: 100%;
    height: 30px;
    border-radius: 10px;
    border: none;
    color: #1e1d1d;
    font-size: 15px;
    font-weight: 600;
    user-select: none;
    font-family:'Poppins', 'Roboto', sans-serif;
    padding-left: 10px;
    background-color: #e0dede;
}

input[type="password"]{
    margin-top: 5px;
    width: 100%;
    height: 30px;
    border-radius: 10px;
    border: none;
    color: #1e1d1d;
    font-size: 15px;
    font-weight: 600;
    user-select: none;
    font:'Poppins', 'Roboto', sans-serif;
    padding-left: 10px;
    background-color: #e0dede;
}

input[type='file']{
    font-family: 'Poppins', 'Roboto', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #1e1d1d;
}
    </style>
</head>
<body
    <div class="container">
        <h1 class="header-title">Coach<span class="white-text bg-title">BOT</span></h1>
        <h1 class="welcome-text">Welcome to the Test Create Page!</h1>
        <p class="message-text">Upload a csv file to create tests.</p>
        <h1 id='urlSlug' style="display: none;">{{urlSlug}}</h1>
        <form id='form' method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <br><br>
            <div id="select-file-alt" class="select-file-text">Select a file..</div>
            <input class="select-file" type="file" id="myfile" name="myfile" accept=".csv">
            <br><br>
            <input id="submit-button" class="submit-button" type="submit" value="Submit">
        </form>
        <br><br>
        <h1 id="message" class="message-text red-text"></h1>
    </div>

    <script>
        var file = document.getElementById("myfile");
        var fileAlt = document.getElementById("select-file-alt");
        var submitButton = document.getElementById("submit-button");
        var form = document.getElementById("form");
        const urlSlug = document.getElementById('urlSlug').innerHTML;

        form.addEventListener('submit', function(e){
            e.preventDefault();
            submitButton.disabled = true;
            submitButton.style.backgroundColor = "#808080";
            submitButton.style.cursor = "not-allowed";
            const formData = new FormData(this);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
            fetch(`{% url urlSlug %}`, {
                method: 'POST',
                body: formData
            }).then((response)=>{
                if(response.ok){
                    console.log('File uploaded successfully');
                    response.json().then(function(result){
                        let records = JSON.stringify(result);
                        document.getElementById('message').innerHTML += "<br>"
                        Object.keys(result).forEach(function(key){
                            if(key!=='errors'){
                                document.getElementById('message').innerHTML += key + ": " + result[key] + "<br>";
                            }
                        }) 
                    })
                }
                else{
                    response.json().then(function(result){
                        if(result['exception']===undefined){
                            let records = JSON.stringify(result);
                            document.getElementById('message').innerHTML += "<br>"
                            Object.keys(result).forEach(function(key){
                                if(key!=='errors'){
                                    document.getElementById('message').innerHTML += key + ": " + result[key] + "<br>";
                                }
                                else{
                                    document.getElementById('message').innerHTML += "<br>"
                                    result[key].forEach(function(error){
                                        document.getElementById('message').innerHTML += "Error in Row: " + JSON.stringify(error['row_number']) + ' message: '+ JSON.stringify(error['message']) + "<br>";
                                    })
                                }
                            }) 
                        }
                        else{
                            document.getElementById('message').innerHTML = 'File upload failed. Please try again.';
                        }
                    })
                }
            }).catch((error)=>{
                console.log(error)
            })
        })

        fileAlt.onclick = function(){
            document.getElementById('myfile').click();
            document.getElementById('message').innerHTML = "Selecting file...";
        };

        file.onchange = function(e){
            console.log('inside...')
            if(file.files.length > 0)
            {
                submitButton.disabled = false;
                submitButton.style.backgroundColor = "#4CAF50";
                submitButton.style.cursor = "pointer";

                const ext = file.files[0].name.substring(file.files[0].name.lastIndexOf(".") + 1);
                if (ext !== "csv") {
                    document.getElementById("message").innerHTML = "Please select a CSV file.";
                    return false;
                }
                document.getElementById('message').innerHTML = file.files[0].name + " selected";
            }
            else{
                document.getElementById('message').innerHTML = "Please select a file...";
            }
        };
        
        submitButton.onclick = function(){
            if(file.files?.length === 0)
            {
                document.getElementById('message').innerHTML = "Please select a file...";
                return false;
            }
            else
            {
                return true;
            }
        };

    </script>

</body>
</html>
