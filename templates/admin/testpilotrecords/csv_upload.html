{% extends "admin/base_site.html" %}

{% block content %}
    <div class="module">
        <h2 style="text-align: center; color: #333;">📂 Upload CSV File</h2>
        <hr>

        <form method="post" enctype="multipart/form-data" class="aligned">
            {% csrf_token %}
            <!-- {{form.as_p}} -->

            <!-- CSV File Upload -->
            <div class="form-row">
                <label for="csv_file"><strong>Select CSV File:</strong></label>
                {{ form.csv_file }}
            </div>

            <p style="color: #888; font-size: 14px;">
                ⚠️ Only <strong>.csv</strong> files are allowed.
            </p>

            <div style="text-align: center; margin-top: 15px;">
                <button type="submit" class="button btn-primary">📤 Upload</button>
                <a href=".." class="button btn-secondary">🔙 Cancel</a>
            </div>
        </form>
    </div>

    <style>
        .module {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }

        .form-row {
            margin-bottom: 10px;
        }

        .button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
{% endblock %}
